<section class="py-24 bg-white dark:bg-zinc-950 text-zinc-900 dark:text-white transition-colors duration-300">
  <div class="max-w-4xl mx-auto px-6">
    <!-- Header -->
    <div class="text-center mb-14">
      <h2 class="text-3xl md:text-4xl font-bold mb-4">{{ settings.text().faq.title }}</h2>

      <p class="text-zinc-600 dark:text-zinc-400">
        {{ settings.text().faq.subtitle }}
      </p>
    </div>

    <!-- FAQ Items -->
    <div class="space-y-4">
      @for (item of settings.text().faq.items; track item.q; let i = $index) {
        <div
          class="border border-zinc-200 dark:border-zinc-800 rounded-xl p-5 bg-zinc-50 dark:bg-zinc-900 cursor-pointer transition-colors"
          (click)="toggle(i)"
        >
          <div class="flex justify-between items-center">
            <h3 class="font-semibold">{{ item.q }}</h3>

            <span class="text-zinc-500 dark:text-zinc-400">
              {{ openIndex() === i ? '-' : '+' }}
            </span>
          </div>

          @if (openIndex() === i) {
            <p class="text-zinc-600 dark:text-zinc-400 mt-3">
              {{ item.a }}
            </p>
          }
        </div>
      }
    </div>
  </div>
</section>
